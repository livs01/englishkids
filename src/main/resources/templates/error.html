<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" tabindex="-1" class="container">
    <section class="card card-narrow" aria-labelledby="titulo-erro-pagina">
        <h1 id="titulo-erro-pagina" th:text="${tituloErro} ?: 'Ocorreu um erro'">Ocorreu um erro</h1>
        <div class="alert alert-error" role="alert"
             th:text="${mensagem} ?: 'Não foi possível concluir a operação.'">
            Não foi possível concluir a operação.
        </div>
        <a class="btn btn-primary" th:href="@{/}">Voltar ao início</a>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
