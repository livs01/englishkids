<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Administração')}"></head>
<body>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" tabindex="-1" class="container">
    <h1>Painel de administração</h1>
    <div th:replace="~{fragments/layout :: mensagens}"></div>

    <ul class="grid-cards">
        <li class="card">
            <h2><a th:href="@{/admin/usuarios}">Usuários</a></h2>
            <p>Cadastre usuários, altere perfis e ative ou desative contas.</p>
        </li>
        <li class="card">
            <h2><a th:href="@{/palavras}">Palavras</a></h2>
            <p>Cadastre, edite e remova palavras do vocabulário.</p>
        </li>
        <li class="card">
            <h2><a th:href="@{/temas}">Temas</a></h2>
            <p>Gerencie os temas que agrupam as palavras.</p>
        </li>
    </ul>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
