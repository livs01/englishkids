<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Novo usuário')}"></head>
<body>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" tabindex="-1" class="container">
    <h1>Novo usuário</h1>
    <p class="muted">Campos marcados com <span aria-hidden="true">*</span><span class="visually-hidden">asterisco</span> são obrigatórios.</p>

    <form class="card form" th:object="${usuarioForm}" th:action="@{/admin/usuarios}" method="post">

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-error" role="alert">
            <p><strong>Corrija os problemas abaixo:</strong></p>
            <ul>
                <li th:each="e : ${#fields.errors('*')}" th:text="${e}">Erro</li>
            </ul>
        </div>

        <div class="form-group">
            <label for="nome">Nome <span aria-hidden="true">*</span></label>
            <input type="text" th:field="*{nome}" required aria-required="true" maxlength="100"
                   th:attr="aria-invalid=${#fields.hasErrors('nome') ? 'true' : null}, aria-describedby=${#fields.hasErrors('nome') ? 'nome-erro' : null}">
            <span id="nome-erro" class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
        </div>

        <div class="form-group">
            <label for="username">Login <span aria-hidden="true">*</span></label>
            <input type="text" th:field="*{username}" required aria-required="true" maxlength="50" autocomplete="off"
                   th:attr="aria-invalid=${#fields.hasErrors('username') ? 'true' : null}, aria-describedby=${#fields.hasErrors('username') ? 'username-ajuda username-erro' : 'username-ajuda'}">
            <small id="username-ajuda" class="muted">De 3 a 50 caracteres: letras, números, ponto, hífen ou sublinhado.</small>
            <span id="username-erro" class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="senha">Senha <span aria-hidden="true">*</span></label>
                <input type="password" th:field="*{senha}" required aria-required="true" minlength="6" maxlength="72" autocomplete="new-password"
                       th:attr="aria-invalid=${#fields.hasErrors('senha') ? 'true' : null}, aria-describedby=${#fields.hasErrors('senha') ? 'senha-erro' : null}">
                <span id="senha-erro" class="field-error" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"></span>
            </div>

            <div class="form-group">
                <label for="confirmacaoSenha">Confirmar senha <span aria-hidden="true">*</span></label>
                <input type="password" th:field="*{confirmacaoSenha}" required aria-required="true" autocomplete="new-password"
                       th:attr="aria-invalid=${#fields.hasErrors('confirmacaoSenha') ? 'true' : null}, aria-describedby=${#fields.hasErrors('confirmacaoSenha') ? 'confirmacaoSenha-erro' : null}">
                <span id="confirmacaoSenha-erro" class="field-error" th:if="${#fields.hasErrors('confirmacaoSenha')}" th:errors="*{confirmacaoSenha}"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="perfil">Perfil <span aria-hidden="true">*</span></label>
            <select th:field="*{perfil}" required aria-required="true">
                <option th:each="p : ${perfis}" th:value="${p.name()}" th:text="${p.rotulo}">Perfil</option>
            </select>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-outline" th:href="@{/admin/usuarios}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
