<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${itemId == null ? 'Novo tema' : 'Editar tema'})}"></head>
<body>
<a th:replace="~{fragments/layout :: skip}"></a>
<header th:replace="~{fragments/layout :: header}"></header>

<main id="conteudo" tabindex="-1" class="container">
    <h1 th:text="${itemId == null ? 'Novo tema' : 'Editar tema'}">Novo tema</h1>
    <p class="muted">Campos marcados com <span aria-hidden="true">*</span><span class="visually-hidden">asterisco</span> são obrigatórios.</p>

    <form class="card form" th:object="${temaForm}"
          th:action="${itemId == null} ? @{/temas} : @{/temas/{id}(id=${itemId})}" method="post">

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-error" role="alert">
            <p><strong>Corrija os problemas abaixo:</strong></p>
            <ul>
                <li th:each="e : ${#fields.errors('*')}" th:text="${e}">Erro</li>
            </ul>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="nomeIngles">Nome em inglês <span aria-hidden="true">*</span></label>
                <input type="text" th:field="*{nomeIngles}" lang="en" required aria-required="true" maxlength="60"
                       th:attr="aria-invalid=${#fields.hasErrors('nomeIngles') ? 'true' : null}, aria-describedby=${#fields.hasErrors('nomeIngles') ? 'nomeIngles-erro' : null}">
                <span id="nomeIngles-erro" class="field-error" th:if="${#fields.hasErrors('nomeIngles')}" th:errors="*{nomeIngles}"></span>
            </div>

            <div class="form-group">
                <label for="nomePortugues">Nome em português <span aria-hidden="true">*</span></label>
                <input type="text" th:field="*{nomePortugues}" required aria-required="true" maxlength="60"
                       th:attr="aria-invalid=${#fields.hasErrors('nomePortugues') ? 'true' : null}, aria-describedby=${#fields.hasErrors('nomePortugues') ? 'nomePortugues-erro' : null}">
                <span id="nomePortugues-erro" class="field-error" th:if="${#fields.hasErrors('nomePortugues')}" th:errors="*{nomePortugues}"></span>
            </div>
        </div>

        <div class="form-group">
            <label for="emoji">Emoji</label>
            <input type="text" th:field="*{emoji}" maxlength="16"
                   th:attr="aria-invalid=${#fields.hasErrors('emoji') ? 'true' : null}, aria-describedby=${#fields.hasErrors('emoji') ? 'emoji-ajuda emoji-erro' : 'emoji-ajuda'}">
            <small id="emoji-ajuda" class="muted">Um emoji que represente o tema (opcional). Exemplo: 🐶</small>
            <span id="emoji-erro" class="field-error" th:if="${#fields.hasErrors('emoji')}" th:errors="*{emoji}"></span>
        </div>

        <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea th:field="*{descricao}" rows="3" maxlength="300"
                      th:attr="aria-invalid=${#fields.hasErrors('descricao') ? 'true' : null}, aria-describedby=${#fields.hasErrors('descricao') ? 'descricao-erro' : null}"></textarea>
            <span id="descricao-erro" class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a class="btn btn-outline" th:href="@{/temas}">Cancelar</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
