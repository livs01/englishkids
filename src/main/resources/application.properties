spring.application.name=englishkids

# --- Persistência: PostgreSQL (instalado localmente; gerenciado pelo pgAdmin) ---
# Para trocar usuário/senha/porta, edite o valor padrão (o que vem depois dos dois pontos)
# ou defina as variáveis de ambiente DB_URL, DB_USER e DB_PASSWORD na configuração de execução do Eclipse.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/englishkids}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# O Hibernate cria/atualiza as tabelas automaticamente (suficiente para o trabalho).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- Usuários e conteúdo iniciais (DEV). Altere/desative em produção. ---
app.seed.enabled=true
app.seed.admin-password=admin123
app.seed.user-password=user123
